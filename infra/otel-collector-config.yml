extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource/demo_defaults:
    attributes:
      - key: service.namespace
        value: demo
        action: insert
      - key: deployment.environment
        value: demo
        action: insert
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  kafka/traces:
    brokers: ["kafka:9092"]
    topic: otel-traces
    encoding: otlp_proto
  kafka/metrics:
    brokers: ["kafka:9092"]
    topic: otel-metrics
    encoding: otlp_proto
  kafka/logs:
    brokers: ["kafka:9092"]
    topic: otel-logs
    encoding: otlp_proto

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/demo_defaults, batch]
      exporters: [otlp/jaeger, kafka/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/demo_defaults, batch]
      exporters: [prometheus, kafka/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/demo_defaults, batch]
      exporters: [otlphttp/loki, kafka/logs]
