spring:
  datasource:
    url: jdbc:h2:mem:aexa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

aexa:
  jwt:
    secret: test-secret-key-must-be-at-least-32b
    expiry-minutes: 60
  bootstrap:
    admin-username: admin
    admin-password: admin-change-me
    analyst-username: analyst
    analyst-password: analyst-change-me
    seed-catalog: true
